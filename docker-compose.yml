# 학습·시연 목적의 프로젝트입니다. 상용 서비스로 쓰려면 배포 목적에 맞는 보완(보안·운영·확장성)이 필요합니다.

name: locallink

services:

  # Infrastructure

  mariadb:
    image: mariadb:11.2
    container_name: locallinkdb
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?.env 에 DB_ROOT_PASSWORD 를 설정하세요}
      MYSQL_DATABASE: locallink_db
      MYSQL_USER: ${DB_USER:-manager}
      MYSQL_PASSWORD: ${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
    ports:
      - "127.0.0.1:3379:3306"   # 로컬 점검용 (외부 네트워크 비노출)
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - locallink-net

  kafka:
    image: confluentinc/cp-kafka:7.7.0
    container_name: locallink-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - locallink-net


  # Service Discovery

  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    container_name: locallink-eureka
    ports:
      - "8761:8761"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - locallink-net
  

  # Auth Server

  auth-server:
    image: msa-lecture/auth-server:1.0
    container_name: locallink-auth
    ports:
      - "9000:9000"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://locallinkdb:3306/locallink_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-manager}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s
    networks:
      - locallink-net


  # API Gateway

  api-gateway:
    image: msa-lecture/api-gateway:1.0
    container_name: locallink-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://localhost:8080
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    networks:
      - locallink-net


  # Microservices

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: locallink-user
    expose:
      - "8081"   # 게이트웨이/내부 네트워크 전용 (호스트 비노출)
    environment:
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?.env 에 INTERNAL_API_TOKEN 을 설정하세요}
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://locallinkdb:3306/locallink_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-manager}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-server:9000
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    networks:
      - locallink-net

  program-service:
    build:
      context: ./program-service
      dockerfile: Dockerfile
    container_name: locallink-program
    ports:
      # 개발용 vite 프록시(/program-service)가 쓰는 공개 읽기 경로. 로컬 루프백에만 바인딩.
      - "127.0.0.1:8082:8082"
    environment:
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?.env 에 INTERNAL_API_TOKEN 을 설정하세요}
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://locallinkdb:3306/locallink_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-manager}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-server:9000
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
    networks:
      - locallink-net

  participation-service:
    build:
      context: ./participation-service
      dockerfile: Dockerfile
    container_name: locallink-participation
    expose:
      - "8083"   # 게이트웨이/내부 네트워크 전용 (호스트 비노출)
    environment:
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?.env 에 INTERNAL_API_TOKEN 을 설정하세요}
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://locallinkdb:3306/locallink_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-manager}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-server:9000
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - locallink-net

  settlement-service:
    build:
      context: ./settlement-service
      dockerfile: Dockerfile
    container_name: locallink-settlement
    expose:
      - "8084"   # 게이트웨이/내부 네트워크 전용 (호스트 비노출)
    environment:
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?.env 에 INTERNAL_API_TOKEN 을 설정하세요}
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:mariadb://locallinkdb:3306/locallink_db
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-manager}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:?.env 에 DB_PASSWORD 를 설정하세요}
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI=http://auth-server:9000
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      mariadb:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - locallink-net

  recommend-service:
    build:
      context: ./recommend-service
      dockerfile: Dockerfile
    container_name: locallink-recommend
    expose:
      - "8085"   # 게이트웨이/내부 네트워크 전용 (호스트 비노출)
    environment:
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:?.env 에 INTERNAL_API_TOKEN 을 설정하세요}
      - EUREKA_SERVER_URL=http://eureka-server:8761/eureka
      - EUREKA_INSTANCE_HOST=recommend-service
      - JWT_ISSUER_URI=http://localhost:8080
      - JWK_SET_URI=http://auth-server:9000/oauth2/jwks
      - PARTICIPATION_SERVICE_URL=http://participation-service:8083
      - PROGRAM_SERVICE_URL=http://program-service:8082
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      eureka-server:
        condition: service_healthy
      auth-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
      participation-service:
        condition: service_started
      program-service:
        condition: service_started
    networks:
      - locallink-net


# Volumes & Networks

volumes:
  mariadb_data:
  kafka_data:

networks:
  locallink-net:
    driver: bridge