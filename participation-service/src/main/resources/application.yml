server:
  port: 8083

spring:
  application:
    name: participation-service

  datasource:
    url: jdbc:mariadb://locallinkdb:3306/locallink_db
    # 컨테이너 이름 locallinkdb 로 입력 (원래 IP를 입력하지만, 재부팅 시 변경될 수 있는 가능성 제거)
    username: manager
    password: SqlDba-1
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://auth-server:9000/oauth2/jwks
          issuer-uri: http://auth-server:9000

  # Kafka 설정
  kafka:
    bootstrap-servers: kafka:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

    consumer:
      group-id: participation-service
      auto-offset-reset: earliest

      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer

      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.value.default.type: java.util.HashMap

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

# 서비스 간 호출은 코드에서 http://<서비스ID>/... 로 통일 (@LoadBalanced WebClient + Eureka 조회)

# 참여신청 동작 튜닝 (모두 기본값이 있어 생략 가능)
participation:
  pending-timeout-minutes: 10      # 이 시간 넘게 PENDING 이면 FAILED 로 정리 (이벤트 유실/정산 결과 불명 대비)
  cleanup-interval-ms: 60000       # 정리 작업 주기
  http-timeout-seconds: 5          # program/settlement-service 동기 호출 상한
  program-lookup-timeout-ms: 3000   # "내 참여 목록" 에서 항목별 프로그램 상세 조회 상한

# Kafka 토픽명
kafka:
  topic:
    settlement-completed: settlement.completed
    participation-completed: participation.completed

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    diskspace:
      enabled: false

# 서비스 간(/internal/**) 호출용 공유 토큰 - docker-compose 가 .env 의 INTERNAL_API_TOKEN 을 주입한다.
# 비어 있으면 internal 요청은 전부 거부된다 (로컬 bootRun 시 환경변수로 설정).
internal:
  api-token: ${INTERNAL_API_TOKEN:}
