server:
  port: 8082

spring:
  application:
    name: program-service

  datasource:
    url: jdbc:mariadb://locallinkdb:3306/locallink_db 
    # 컨테이너 이름 locallinkdb 로 입력 (원래 IP를 입력하지만, 재부팅 시 변경될 수 있는 가능성 제거)
    username: manager
    password: SqlDba-1
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MariaDBDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:9000/oauth2/jwks
          issuer-uri: http://localhost:9000

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# 서비스 간 통신 설정
service:
  user-service:
    url: http://user-service

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# 서비스 간(/internal/**) 호출용 공유 토큰 - docker-compose 가 .env 의 INTERNAL_API_TOKEN 을 주입한다.
# 비어 있으면 internal 요청은 전부 거부된다 (로컬 bootRun 시 환경변수로 설정).
internal:
  api-token: ${INTERNAL_API_TOKEN:}
