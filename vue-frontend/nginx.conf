server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router history 모드 지원
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 프록시 → API Gateway
    location /api {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 인증 서버 폼 로그인 / 토큰 교환 프록시 → API Gateway
    # 절대경로(cross-origin) 대신 상대경로로 호출하게 해서 CORS를 피한다.
    # proxy_redirect: 3xx 응답의 Location(http://api-gateway:8080/...)을 상대경로로 바꿔
    # 브라우저가 same-origin 리다이렉트 체인을 따라가게 한다.
    location /oauth2 {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
        proxy_cookie_domain ~.+ $host;
    }

    location /logout {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
    }

    location /userinfo {
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /login: POST(폼 로그인)만 인증 서버로 프록시.
    # 그 외 메서드(브라우저가 SPA /login 라우트를 직접 열거나 새로고침)는 앱을 서빙한다.
    location = /login {
        error_page 418 = @spa;
        if ($request_method != POST) {
            return 418;
        }
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
        proxy_cookie_domain ~.+ $host;
    }

    location @spa {
        try_files /index.html =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
}
